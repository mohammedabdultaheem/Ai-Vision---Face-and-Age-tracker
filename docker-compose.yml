version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aivision-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aivision_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aivision_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-aivision}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aivision_user -d aivision"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aivision-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://aivision_user:aivision_secure_pass_2026@postgres:5432/aivision
      - SECRET_KEY=${SECRET_KEY:-ai-vision-enterprise-super-secret-key-change-in-prod-2026}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - BACKEND_CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app/data/models:/app/app/data/models
      - ./backend/app/data/rag_docs:/app/app/data/rag_docs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/system/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aivision-frontend
    restart: always
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  models_data:

